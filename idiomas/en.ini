[0338]
pt = A marca diz o que vai ser AMPLIADO.\n\nO que ficar desmarcado não some do pacote: entra na remontagem do jeito que estava, no tamanho e no formato originais.\n\nMarcar só o que o jogador vê de perto -- rosto, armadura, chão de cidade -- é o que evita o cliente fechar sozinho.
t = The check mark says what will be UPSCALED.\n\nWhatever stays unchecked does not disappear from the package: it goes back in as it was, at the original size and format.\n\nChecking only what the player sees up close -- faces, armor, town ground -- is what keeps the client from closing on its own.

[0339]
pt = A operação diz como o valor entra na conta. `add` soma ao total; `baseadd` soma à base, antes dos multiplicadores; `set` fixa; `enchant` é a parcela que cresce a cada encantamento.\n\nOs nomes de status são os que o seu servidor aceita, lidos do código dele. Um nome fora da lista não é ignorado: derruba o carregamento da tabela de itens inteira.
t = The operation says how the value enters the calculation. `add` adds to the total; `baseadd` adds to the base, before the multipliers; `set` fixes it; `enchant` is the share that grows with each enchant.\n\nThe stat names are the ones your server accepts, read from its own code. A name outside the list is not ignored: it brings down the loading of the whole item table.

[0340]
pt = A operação diz como o valor entra na conta: `set` fixa a base, `add` e `sub` somam antes dos multiplicadores, `mul` multiplica, `enchant` é a parcela que cresce a cada +1.@@A ordem é o momento da conta, e o servidor NÃO tem padrão para ela: falta o atributo, a tabela de itens inteira deixa de carregar. Ela é preenchida sozinha com o que o jogo usa para cada operação.@@Um nome de status que o seu servidor não conheça também derruba a carga. Aponte a pasta do servidor na aba e os que ele não tem aparecem marcados.
t = The operation says how the value enters the sum: `set` fixes the base, `add` and `sub` add before the multipliers, `mul` multiplies, `enchant` is the share that grows with every +1.@@The order is the moment in the sum, and the server has NO default for it: leave the attribute out and the whole item table stops loading. It is filled in for you with what the game uses for each operation.@@A stat name your server does not know also brings the load down. Point at the server folder on the tab and the ones it lacks show up marked.

