pt = Traz do servidor a habilidade que está MARCADA NA LISTA -- e não a do campo "id novo".\n\nPoder, recarga e tipo de efeito não existem no cliente: só o servidor os tem. É assim que se copia os números de uma habilidade que já funciona.\n\nPara reler uma que você criou, marque-a na lista: ela está lá depois de gerar.
t = Reads the skill SELECTED IN THE LIST from the server -- not the one in the "new id" box.\n\nPower, reuse and effect type do not exist in the client: only the server has them. This is how you copy the numbers of a skill that already works.\n\nTo read back one you created, select it in the list: it is there once you generate.

[0985]
pt = Traz do servidor o NPC que está MARCADO NA LISTA -- e não o do campo "id novo".\n\nVem o que o cliente não guarda: atributos, drop, spawn e loja. É assim que se copiam os números de um monstro que já funciona.\n\nSe ele não estiver lá, ainda não existe do lado do servidor: é o caso de preencher e gerar.
t = Reads the NPC SELECTED IN THE LIST from the server -- not the one in the "new id" box.\n\nIt brings what the client does not keep: stats, drops, spawn and shop. This is how you copy the numbers of a monster that already works.\n\nIf it is not there, it does not exist on the server yet: fill the fields in and generate.

[0986]
pt = Traz do servidor o item que está MARCADO NA LISTA -- e não o do campo "id novo".\n\nDano, defesa e preço não existem no cliente: só o servidor os tem. É assim que se copia os números de um item que já funciona.\n\nPara reler um item que você criou, marque-o na lista: ele está lá depois de gerar.
t = Reads the item SELECTED IN THE LIST from the server -- not the one in the "new id" box.\n\nDamage, defence and price do not exist in the client: only the server has them. This is how you copy the numbers of an item that already works.\n\nTo read back an item you created, select it in the list: it is there once you generate.

[0987]
pt = Traz o NPC marcado na lista da esquerda para o formulário, para você acrescentar efeito a um NPC que JÁ EXISTE.\n\nO id, o nome e o título vêm dele. Se ele foi criado por este programa, os efeitos que já tem voltam também, e você acrescenta aos que estão lá.\n\nAo gerar, o programa pergunta se pode substituir: a linha antiga sai e a nova entra no lugar, com o mesmo id.\n\nDuplo clique na lista faz o mesmo.
t = Brings the NPC selected in the list on the left into the form, so you can add an effect to an NPC that ALREADY EXISTS.\n\nThe id, the name and the title come from it. If it was created by this program, the effects it already has come back too, and you add to them.\n\nWhen you generate, the program asks whether it may replace it: the old row goes out and the new one takes its place, with the same id.\n\nDouble-click in the list does the same.

