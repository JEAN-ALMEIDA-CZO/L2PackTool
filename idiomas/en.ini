[0587]
pt = Grava esta textura num arquivo seu, do jeito que ela está no pacote.\n\nComprimida sai .dds com o mesmo DXT; sem compressão sai .tga. Em nenhum dos dois há conversão: são os bytes do .utx.
t = Writes this texture to a file of yours, exactly as it is in the package.\n\nCompressed comes out as .dds with the same DXT; uncompressed comes out as .tga. Neither one is converted: they are the bytes from the .utx.

[0588]
pt = Grava uma cópia aberta de cada arquivo na pasta escolhida.\n\nO método é descoberto pelo cabeçalho do próprio arquivo, e não pela extensão: um .dat pode ser RSA e um .utx pode ser XOR derivado do nome -- é por isso que renomear um .utx antes de abrir o corrompe em silêncio.\n\nArquivo já aberto é copiado como está.\n\nCriptografar faz o caminho inverso, e aí o método vem da extensão: um arquivo aberto não guarda de onde veio. O nome do arquivo importa, porque a chave do Ver121 deriva dele.
t = Writes a decrypted copy of each file into the chosen folder.\n\nThe method comes from the file header, not from the extension: a .dat can be RSA and a .utx can be XOR derived from the name -- which is why renaming a .utx before opening it corrupts it silently.\n\nA file that is already open is copied as is.\n\nEncrypt goes the other way, and there the method comes from the extension: an open file does not record where it came from. The file name matters, because the Ver121 key derives from it.

