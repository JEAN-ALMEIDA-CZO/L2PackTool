pt = A rede que inventa os pixels que não existiam.\n\nCada uma erra de um jeito: umas inventam grão demais em superfície lisa, outras amaciam pedra e tecido. A linha abaixo descreve a escolhida.\n\nOs modelos são lidos da pasta ferramentas/upscayl-models -- acrescentar um .param com o .bin ao lado faz ele aparecer aqui.
t = The network that invents the pixels that were not there.\n\nEach one is wrong in its own way: some invent too much grain on smooth surfaces, others soften stone and cloth. The line below describes the one you picked.\n\nModels are read from the ferramentas/upscayl-models folder -- dropping in a .param with its .bin next to it makes it show up here.

