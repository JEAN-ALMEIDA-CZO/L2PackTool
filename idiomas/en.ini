pt = Escreve usingServerSideName e usingServerSideTitle no XML. Com eles o servidor envia o nome junto com o NPC, e o cliente só desenha o que recebeu.\n\nÉ a saída quando o cliente não resolve o nome sozinho -- um NPC com classe própria, gerada aqui, costuma aparecer como "NoNameNPC" no visualizador mesmo com o nome gravado no npcname-e.dat.\n\nDesmarque se quiser que valha o nome que está no cliente -- num cliente traduzido, por exemplo.
t = Writes usingServerSideName and usingServerSideTitle into the XML. With them the server sends the name along with the NPC, and the client only draws what it received.\n\nIt is the way out when the client cannot resolve the name on its own -- an NPC with its own class, generated here, tends to show as "NoNameNPC" in the viewer even with the name written into npcname-e.dat.\n\nUntick it if you want the name that is in the client to win -- on a translated client, for instance.

