[1020]
pt = Vou abrir o cliente em DevMode para você ver o NPC %s.\n\nO comando já vai estar na área de transferencia:\n    %s\n\nNo jogo: Tab abre o console, Ctrl+V cola, Enter executa.\nSe preferir o visualizador de NPC, o comando e  nv .\n\nContinuar?
t = I am going to open the client in DevMode so you can see NPC %s.\n\nThe command will already be on the clipboard:\n    %s\n\nIn game: Tab opens the console, Ctrl+V pastes, Enter runs it.\nIf you prefer the NPC viewer, the command is  nv .\n\nContinue?

[1021]
pt = Vou abrir o cliente sem servidor, num mapa local, com o console de desenvolvimento ligado.\n\nE o único jeito de ver o EFEITO: nenhum programa fora do jogo desenha partícula do Unreal Engine 2.\n\nVai aparecer um aviso dizendo que o AGP esta desativado: clique OK. E uma checagem de hardware do D3DDrv que nenhuma maquina moderna passa, e o jogo fica parado nela ate o clique.\n\nFeche o jogo normalmente quando terminar.\n\nNo jogo, para ver o NPC do formulario:\n    Tab   e depois   %s\n\nContinuar?
t = I am going to open the client with no server, on a local map, with the development console on.\n\nIt is the only way to see the EFFECT: no program outside the game draws Unreal Engine 2 particles.\n\nA warning will show up saying AGP is disabled: click OK. It is a D3DDrv hardware check that no modern machine passes, and the game sits on it until you click.\n\nClose the game normally when you are done.\n\nIn game, to see the NPC from the form:\n    Tab   and then   %s\n\nContinue?

[1022]
pt = Vou sobrescrever no cliente:\n\n  %s\n\nO que estiver la vai para system\\backup_npc antes.\n\nContinuar?
t = I am going to overwrite in the client:\n\n  %s\n\nWhatever is there goes to system\\backup_npc first.\n\nContinue?

[1023]
pt = Vou tirar do cliente:\n\n  - a linha do %s no npcgrp.dat\n  - o nome dele no npcname-e.dat\n  - o pacote FX_%s.u\n\nO que estiver la vai para system\\backup_npc antes.\n\nDo lado do servidor você ainda vai precisar apagar\ndata/xml/npcs/custom/npc_%s.xml e dar //reload npc.\n\nContinuar?
t = I am going to remove from the client:\n\n  - the %s row in npcgrp.dat\n  - its name in npcname-e.dat\n  - the package FX_%s.u\n\nWhatever is there goes to system\\backup_npc first.\n\nOn the server side you will still need to delete\ndata/xml/npcs/custom/npc_%s.xml and run //reload npc.\n\nContinue?

