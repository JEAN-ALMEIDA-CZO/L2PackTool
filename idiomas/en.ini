pt = A pasta de dados do servidor. Marcada a caixa, a XML da arma criada é copiada direto para a pasta de itens dele.@@A subpasta ao lado sai do próprio servidor: o programa lista as que existem e marca a que casa com o tipo do item — `weapons` para arma, quando ela existe. Nem todo pack lê arma de `custom`, e gravar no lugar errado entrega o arquivo onde o servidor ignora.@@Onde é essa pasta sai do próprio servidor: o programa lê os arquivos dele para descobrir. Se não der para saber, nada é gravado -- melhor não gravar do que gravar no lugar errado.
t = The server's data folder. With the box ticked, the created weapon's XML is copied straight into its items folder.@@The subfolder beside it comes from the server itself: the program lists the ones that exist and picks the one that matches the item's kind -- `weapons` for a weapon, when it is there. Not every pack reads weapons from `custom`, and writing in the wrong place hands the file to a folder the server ignores.@@Where that folder is comes from the server itself: the program reads its files to find out. If it cannot tell, nothing is written -- better not to write than to write in the wrong place.

