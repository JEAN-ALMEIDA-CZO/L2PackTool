t = `Copy to the ones above` repeats this level on every level above it. It is the short way to "from +7 on, all red" without touching fourteen levels by hand.@@`Back to the original` undoes this level only, with what was in the file when it was read.

[1044]
pt = `enquanto equipado` aceita várias, separadas por `;`. As outras três, só uma.@@Cuidado com a chance: o servidor descarta a skill EM SILÊNCIO se ela faltar ou for zero. Não dá erro, não vai para o log -- a arma simplesmente não faz nada, e quem for testar vai culpar a skill.@@O id é o da habilidade no servidor. A aba Habilidades lista todas as que existem neste cliente.
t = `while equipped` takes several, separated by `;`. The other three, only one.@@Mind the chance: the server drops the skill SILENTLY if it is missing or zero. No error, nothing in the log -- the weapon simply does nothing, and whoever tests it will blame the skill.@@The id is the skill's id on the server. The Skills tab lists every one in this client.

