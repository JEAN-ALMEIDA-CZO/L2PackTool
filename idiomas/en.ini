[0584]
pt = Gerar escreve as tabelas numa pasta à parte; instalar as põe no cliente. São separados de propósito: dá para olhar o resultado antes de o cliente depender dele.\n\nNa primeira instalação as tabelas originais são guardadas em system/backup_itens, e é de lá que Restaurar as traz de volta.
t = Generate writes the tables into a separate folder; install puts them in the client. They are separate on purpose: you can look at the result before the client depends on it.\n\nOn the first install the original tables are kept in system/backup_itens, and that is where Restore brings them back from.

[0585]
pt = Gerar monta tudo numa pasta de trabalho e não toca no cliente: sai dali o npcgrp.dat e o npcname-e.dat com a linha nova, o pacote do NPC e o XML do servidor.\n\nInstalar copia isso para dentro do cliente, guardando o que estava lá em system/backup_npc antes.\n\nSão dois passos de propósito: dá para conferir o que saiu antes de mexer num cliente que você usa para jogar.
t = Generate builds everything in a work folder and does not touch the client: out of it come npcgrp.dat and npcname-e.dat with the new row, the NPC's package and the server XML.\n\nInstall copies that into the client, saving whatever was there to system/backup_npc first.\n\nThey are two steps on purpose: you get to check what came out before touching a client you actually play on.

