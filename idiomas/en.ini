pt = Tira do pacote as texturas marcadas e grava numa pasta sua, no formato em que elas estão -- DDS com o mesmo DXT, ou TGA quando a textura não é comprimida.\n\nOs bytes são os mesmos que estão dentro do .utx: nada é recomprimido, nada é convertido.\n\nServe para guardar o original antes de mexer, abrir no Photoshop ou levar a textura para outro pacote.
t = Takes the checked textures out of the package and writes them to a folder of yours, in the format they are in -- DDS with the same DXT, or TGA when the texture is not compressed.\n\nThe bytes are the same ones inside the .utx: nothing is recompressed, nothing is converted.\n\nUse it to keep the original before changing anything, to open it in Photoshop, or to move the texture to another package.

