[0350]
pt = A que altura o efeito fica, em unidades do jogo, contadas do CHÃO do boneco -- é o que a régua ao lado mostra: pés, cintura, peito, cabeça, ou acima dela.\n\nO osso decide o X e o Y: o efeito acompanha aquela parte do corpo. A altura decide o Z, e vale sozinha.\n\nCom altura 0 o efeito fica preso ao osso, sem ajuste -- que é o que se quer para um brilho na mão.\n\nAceita número negativo, para descer abaixo do chão.
t = How high the effect sits, in game units, counted from the GROUND of the model -- which is what the ruler beside it shows: feet, waist, chest, head, or above it.\n\nThe bone decides X and Y: the effect follows that part of the body. The height decides Z, on its own.\n\nWith height 0 the effect stays pinned to the bone, with no adjustment -- which is what you want for a glow in the hand.\n\nNegative numbers work, to go below the ground.

[0351]
pt = A raça é escrita como se fosse a skill 4416, mas não é uma skill.@@O core lê o `level` daquela linha como a raça do mob e sai fora sem registrar golpe nenhum. Por isso ela fica aqui, e não na lista abaixo: na lista, alguém apagaria a raça achando que estava tirando um ataque.
t = The race is written as if it were skill 4416, but it is not a skill.@@The core reads that line's `level` as the mob's race and moves on without registering any skill. That is why it sits here and not in the list below: in the list, someone would delete the race thinking they were removing an attack.

