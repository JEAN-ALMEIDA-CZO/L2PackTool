[0790]
pt = O cliente do L2 e de 32 bits. Escala 2x quadruplica a memória de textura; 4x multiplica por 16. Marcar so o que o jogador ve de perto e o que evita o cliente fechar sozinho em certas áreas.
t = The L2 client is 32-bit. A 2x scale quadruples texture memory; 4x multiplies it by 16. Selecting only what the player sees up close is what keeps the client from crashing in certain areas.

[0791]
pt = O cliente do Lineage 2 é um só; o emulador não. Uns guardam o NPC em XML, outros em tabelas do banco, e os nomes dos campos mudam entre eles.\n\n"Detectar pelo servidor" lê a pasta que você apontou e monta o perfil a partir dela: onde ficam as coisas, se o alvo da habilidade leva prefixo, como a gaveta de drop é escrita e em que unidade vai a chance. O que foi visto aparece ao lado da caixa.\n\nOs perfis prontos continuam na lista para quem quiser mandar, e um core novo se acrescenta largando um arquivo em recursos/servidores.
t = The Lineage 2 client is one; the emulator is not. Some keep the NPC in XML, others in database tables, and the field names differ between them.\n\n"Detect from the server" reads the folder you pointed at and builds the profile from it: where things live, whether the skill target carries a prefix, how the drop group is written and in what unit the chance goes. What it saw appears next to the box.\n\nThe ready-made profiles stay in the list for whoever wants to decide, and a new core is added by dropping a file into recursos/servidores.

