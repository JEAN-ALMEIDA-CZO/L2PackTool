pt = Gerar monta tudo numa pasta de trabalho e não toca no cliente: sai dali o npcgrp.dat e o npcname-e.dat com a linha nova, o pacote do NPC e o XML do servidor.\n\nInstalar copia isso para dentro do cliente, guardando o que estava lá em system/backup_npc antes.\n\nSão dois passos de propósito: dá para conferir o que saiu antes de mexer num cliente que você usa para jogar.
t = Generar monta todo en una carpeta de trabajo y no toca el cliente: de ahi salen el npcgrp.dat y el npcname-e.dat con la linea nueva, el paquete del NPC y el XML del servidor.\n\nInstalar copia eso dentro del cliente, guardando antes lo que hubiera en system/backup_npc.\n\nSon dos pasos a proposito: puedes comprobar lo que salio antes de tocar un cliente con el que juegas.

