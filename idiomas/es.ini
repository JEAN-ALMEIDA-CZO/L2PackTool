t = La carpeta de datos del servidor. Con la casilla marcada, el XML del arma creada se copia directo a su carpeta de ítems.@@La subcarpeta de al lado sale del propio servidor: el programa lista las que existen y marca la que casa con el tipo del ítem -- `weapons` para arma, cuando existe. No todo pack lee armas de `custom`, y escribir en el lugar equivocado entrega el archivo donde el servidor lo ignora.@@Dónde está esa carpeta sale del propio servidor: el programa lee sus archivos para descubrirlo. Si no se puede saber, no se escribe nada -- mejor no escribir que escribir en el lugar equivocado.

