pt = Vou abrir o cliente em DevMode para você ver o NPC %s.\n\nO comando já vai estar na área de transferencia:\n    %s\n\nNo jogo: Tab abre o console, Ctrl+V cola, Enter executa.\nSe preferir o visualizador de NPC, o comando e  nv .\n\nContinuar?
t = Voy a abrir el cliente en DevMode para que veas el NPC %s.\n\nEl comando ya estara en el portapapeles:\n    %s\n\nEn el juego: Tab abre la consola, Ctrl+V pega, Enter lo ejecuta.\nSi prefieres el visor de NPC, el comando es  nv .\n\nContinuar?

[1021]
pt = Vou abrir o cliente sem servidor, num mapa local, com o console de desenvolvimento ligado.\n\nE o único jeito de ver o EFEITO: nenhum programa fora do jogo desenha partícula do Unreal Engine 2.\n\nVai aparecer um aviso dizendo que o AGP esta desativado: clique OK. E uma checagem de hardware do D3DDrv que nenhuma maquina moderna passa, e o jogo fica parado nela ate o clique.\n\nFeche o jogo normalmente quando terminar.\n\nNo jogo, para ver o NPC do formulario:\n    Tab   e depois   %s\n\nContinuar?
t = Voy a abrir el cliente sin servidor, en un mapa local, con la consola de desarrollo activada.\n\nEs la unica forma de ver el EFECTO: ningun programa fuera del juego dibuja particulas de Unreal Engine 2.\n\nAparecera un aviso diciendo que el AGP esta desactivado: pulsa OK. Es una comprobacion de hardware del D3DDrv que ninguna maquina moderna pasa, y el juego se queda ahi hasta que hagas clic.\n\nCierra el juego normalmente cuando termines.\n\nEn el juego, para ver el NPC del formulario:\n    Tab   y despues   %s\n\nContinuar?

[1022]
pt = Vou sobrescrever no cliente:\n\n  %s\n\nO que estiver la vai para system\\backup_npc antes.\n\nContinuar?
t = Voy a sobrescribir en el cliente:\n\n  %s\n\nLo que este alli pasa antes a system\\backup_npc.\n\nContinuar?

[1023]
pt = Vou tirar do cliente:\n\n  - a linha do %s no npcgrp.dat\n  - o nome dele no npcname-e.dat\n  - o pacote FX_%s.u\n\nO que estiver la vai para system\\backup_npc antes.\n\nDo lado do servidor você ainda vai precisar apagar\ndata/xml/npcs/custom/npc_%s.xml e dar //reload npc.\n\nContinuar?
t = Voy a quitar del cliente:\n\n  - la linea del %s en npcgrp.dat\n  - su nombre en npcname-e.dat\n  - el paquete FX_%s.u\n\nLo que este alli pasa antes a system\\backup_npc.\n\nDel lado del servidor todavia tendras que borrar\ndata/xml/npcs/custom/npc_%s.xml y dar //reload npc.\n\nContinuar?

