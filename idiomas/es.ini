pt = Grava esta textura num arquivo seu, do jeito que ela está no pacote.\n\nComprimida sai .dds com o mesmo DXT; sem compressão sai .tga. Em nenhum dos dois há conversão: são os bytes do .utx.
t = Graba esta textura en un archivo tuyo, tal como esta en el paquete.\n\nComprimida sale .dds con el mismo DXT; sin comprimir sale .tga. En ninguno de los dos hay conversion: son los bytes del .utx.

[0588]
pt = Grava uma cópia aberta de cada arquivo na pasta escolhida.\n\nO método é descoberto pelo cabeçalho do próprio arquivo, e não pela extensão: um .dat pode ser RSA e um .utx pode ser XOR derivado do nome -- é por isso que renomear um .utx antes de abrir o corrompe em silêncio.\n\nArquivo já aberto é copiado como está.\n\nCriptografar faz o caminho inverso, e aí o método vem da extensão: um arquivo aberto não guarda de onde veio. O nome do arquivo importa, porque a chave do Ver121 deriva dele.
t = Graba una copia descifrada de cada archivo en la carpeta elegida.\n\nEl metodo sale de la cabecera del propio archivo, y no de la extension: un .dat puede ser RSA y un .utx puede ser XOR derivado del nombre -- por eso renombrar un .utx antes de abrirlo lo corrompe en silencio.\n\nUn archivo ya abierto se copia tal cual.\n\nCifrar hace el camino inverso, y ahi el metodo viene de la extension: un archivo abierto no guarda de donde vino. El nombre del archivo importa, porque la clave del Ver121 deriva de el.

