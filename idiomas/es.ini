pt = A marca diz o que vai ser AMPLIADO.\n\nO que ficar desmarcado não some do pacote: entra na remontagem do jeito que estava, no tamanho e no formato originais.\n\nMarcar só o que o jogador vê de perto -- rosto, armadura, chão de cidade -- é o que evita o cliente fechar sozinho.
t = La marca dice que se va a AMPLIAR.\n\nLo que quede sin marcar no desaparece del paquete: entra en el montaje tal como estaba, con el tamano y el formato originales.\n\nMarcar solo lo que el jugador ve de cerca -- cara, armadura, suelo de ciudad -- es lo que evita que el cliente se cierre solo.

[0339]
pt = A operação diz como o valor entra na conta. `add` soma ao total; `baseadd` soma à base, antes dos multiplicadores; `set` fixa; `enchant` é a parcela que cresce a cada encantamento.\n\nOs nomes de status são os que o seu servidor aceita, lidos do código dele. Um nome fora da lista não é ignorado: derruba o carregamento da tabela de itens inteira.
t = La operacion dice como entra el valor en la cuenta. `add` suma al total; `baseadd` suma a la base, antes de los multiplicadores; `set` lo fija; `enchant` es la parte que crece con cada encantamiento.\n\nLos nombres de estado son los que acepta tu servidor, leidos de su propio codigo. Un nombre fuera de la lista no se ignora: tumba la carga de toda la tabla de items.

[0340]
pt = A operação diz como o valor entra na conta: `set` fixa a base, `add` e `sub` somam antes dos multiplicadores, `mul` multiplica, `enchant` é a parcela que cresce a cada +1.@@A ordem é o momento da conta, e o servidor NÃO tem padrão para ela: falta o atributo, a tabela de itens inteira deixa de carregar. Ela é preenchida sozinha com o que o jogo usa para cada operação.@@Um nome de status que o seu servidor não conheça também derruba a carga. Aponte a pasta do servidor na aba e os que ele não tem aparecem marcados.
t = La operación dice cómo entra el valor en la cuenta: `set` fija la base, `add` y `sub` suman antes de los multiplicadores, `mul` multiplica, `enchant` es la parte que crece con cada +1.@@El orden es el momento de la cuenta, y el servidor NO tiene valor por defecto: si falta el atributo, la tabla de ítems entera deja de cargar. Se rellena solo con lo que el juego usa para cada operación.@@Un nombre de stat que su servidor no conozca también tumba la carga. Apunte la carpeta del servidor en la pestaña y los que le faltan aparecen marcados.

