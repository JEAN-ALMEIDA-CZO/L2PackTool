[0350]
pt = A que altura o efeito fica, em unidades do jogo, contadas do CHÃO do boneco -- é o que a régua ao lado mostra: pés, cintura, peito, cabeça, ou acima dela.\n\nO osso decide o X e o Y: o efeito acompanha aquela parte do corpo. A altura decide o Z, e vale sozinha.\n\nCom altura 0 o efeito fica preso ao osso, sem ajuste -- que é o que se quer para um brilho na mão.\n\nAceita número negativo, para descer abaixo do chão.
t = A que altura queda el efecto, en unidades del juego, contadas desde el SUELO del muneco: es lo que muestra la regla de al lado -- pies, cintura, pecho, cabeza, o encima de ella.\n\nEl hueso decide la X y la Y: el efecto acompana esa parte del cuerpo. La altura decide la Z, y vale sola.\n\nCon altura 0 el efecto queda fijo al hueso, sin ajuste, que es lo que se quiere para un brillo en la mano.\n\nAcepta numero negativo, para bajar del suelo.

[0351]
pt = A raça é escrita como se fosse a skill 4416, mas não é uma skill.@@O core lê o `level` daquela linha como a raça do mob e sai fora sem registrar golpe nenhum. Por isso ela fica aqui, e não na lista abaixo: na lista, alguém apagaria a raça achando que estava tirando um ataque.
t = La raza se escribe como si fuera la skill 4416, pero no es una skill.@@El core lee el `level` de esa línea como la raza del mob y sigue sin registrar golpe alguno. Por eso queda aquí, y no en la lista de abajo: en la lista, alguien borraría la raza creyendo que quitaba un ataque.

[0352]
pt = A rede que inventa os pixels que não existiam.\n\nCada uma erra de um jeito: umas inventam grão demais em superfície lisa, outras amaciam pedra e tecido. A linha abaixo descreve a escolhida.\n\nOs modelos são lidos da pasta ferramentas/upscayl-models -- acrescentar um .param com o .bin ao lado faz ele aparecer aqui.
t = La red que inventa los pixeles que no existian.\n\nCada una se equivoca a su manera: unas inventan demasiado grano en superficies lisas, otras suavizan la piedra y la tela. La linea de abajo describe la elegida.\n\nLos modelos se leen de la carpeta ferramentas/upscayl-models -- anadir un .param con su .bin al lado hace que aparezca aqui.

